[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridguard"
version = "0.1.0"
description = "Solar asset fault detection and energy forecasting"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<4",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "shap>=0.44,<1",
    "pvlib>=0.11,<1",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "joblib>=1.4,<2",
    "pyarrow>=16",
    "protobuf>=5,<7",
]

[project.optional-dependencies]
# Offline research diagnostics (experiments/). Not required by the API, the
# pipeline, or the web application — only to render report figures.
experiments = [
    "matplotlib>=3.8,<4",
]
# The collector service: MQTT client and the Postgres driver. Not needed by the
# API (which reads prebuilt artifacts), the pipeline, or the web application, so
# it stays out of those images.
collector = [
    "paho-mqtt>=2,<3",
    "psycopg[binary]>=3.1,<4",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.4,<1",
    "black>=24,<27",
    "httpx>=0.27,<1",
    # Regenerates the protobuf stubs. Not needed to run anything — the stubs are
    # committed — but CI uses it to prove they still match the .proto.
    "grpcio-tools>=1.60,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated protobuf stubs are committed so the runtime needs only the protobuf
# package. They must be byte-identical to protoc's output — tests/test_contract.py
# regenerates and compares — so no formatter or linter may touch them.
extend-exclude = ["src/gridguard/contract/v1/*_pb2.py", "src/gridguard/contract/v1/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Declare first-party packages explicitly instead of letting ruff infer them
# from the filesystem. The inference is environment-dependent: a working tree
# containing generated directories (artifacts/, data/processed/) classified
# some `gridguard.*` imports differently than a fresh clone did, so `ruff check`
# passed locally and failed in CI on identical code. An explicit list makes the
# result depend only on what is committed.
known-first-party = ["gridguard", "tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
# See the note under [tool.ruff]: reformatting generated stubs makes them differ
# from protoc's output, which the drift test correctly rejects.
extend-exclude = "src/gridguard/contract/v1/.*_pb2\\.pyi?$"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
