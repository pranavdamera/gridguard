# One-command GridGuard demo.
#
#   docker compose up
#
# starts three things in order: a one-shot build that produces the model,
# calibration and manifest artifacts; the API that serves them; and the web
# application. The API never trains — `artifacts` is what trains, once, and the
# API waits for it to finish successfully before starting.
#
# The distributed path — broker, database, collector — is behind a profile,
# because it is the live-ingestion stack rather than the demo:
#
#   docker compose --profile live up

name: gridguard

services:
  # ---------------------------------------------------------------------
  # One-shot artifact build. Runs to completion and exits.
  # ---------------------------------------------------------------------
  artifacts:
    build:
      context: .
      target: api
    command: ["python", "scripts/build_artifacts.py"]
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    environment:
      DATA_MODE: ${DATA_MODE:-synthetic}
      MODEL_DIR: artifacts/models
      DATA_PROCESSED_DIR: data/processed
      DATA_CURATED_DIR: data/curated
    restart: "no"

  # ---------------------------------------------------------------------
  # Read-only backend.
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    environment:
      DATA_MODE: ${DATA_MODE:-synthetic}
      MODEL_DIR: artifacts/models
      DATA_PROCESSED_DIR: data/processed
      DATA_CURATED_DIR: data/curated
      # Both the browser origin and the in-network origin the web container
      # server-renders from.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://web:3000
    depends_on:
      artifacts:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Flagship frontend.
  # ---------------------------------------------------------------------
  web:
    build:
      context: ./web
      args:
        # Inlined at build time by Next; every page is a server component, so
        # this is resolved on the compose network, never in the viewer's
        # browser.
        NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Live ingestion. Behind the `live` profile — the default demo serves
  # prebuilt artifacts and needs none of this.
  # ---------------------------------------------------------------------
  broker:
    profiles: ["live"]
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  db:
    profiles: ["live"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gridguard
      POSTGRES_USER: gridguard
      # Local-only demo credential on a private compose network with no port
      # published. Not a secret, and deliberately not read from a committed
      # file — a real deployment supplies this through its own secret store.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridguard -d gridguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  collector:
    profiles: ["live"]
    build:
      context: .
      target: collector
    environment:
      GRIDGUARD_MQTT_HOST: broker
      GRIDGUARD_STORE_DSN: >-
        postgresql://gridguard:${POSTGRES_PASSWORD:-gridguard}@db:5432/gridguard
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    restart: unless-stopped

volumes:
  mosquitto_data:
  postgres_data:
