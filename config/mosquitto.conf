# Mosquitto configuration for the GridGuard demo.
#
# Deliberately minimal. This broker exists to carry telemetry between simulated
# edge agents and the collector on one machine; it is not an internet-facing
# deployment and is not configured as one.

listener 1883
protocol mqtt

# No authentication. This is a single-host demo stack on a private compose
# network with no port exposed beyond the host, and adding credentials here
# would mean committing them — which this repository does not do for anything.
# A real deployment needs TLS and per-agent credentials; see docs/deployment.md.
allow_anonymous true

# Persist retained messages and queued QoS-1 messages across a broker restart.
# Without this, restarting the broker silently discards in-flight telemetry, and
# the agent's at-least-once delivery would quietly become at-most-once.
persistence true
persistence_location /mosquitto/data/

# Hold undelivered QoS-1 messages for a subscriber that has gone away, rather
# than dropping them. The collector restarting must not lose what agents sent
# while it was down.
max_queued_messages 100000
persistent_client_expiration 7d

log_dest stdout
log_type warning
log_type error
log_type notice
